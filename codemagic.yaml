workflows:

  # ─────────────────────────────────────────────────────────────────────────────
  # ANDROID RELEASE WORKFLOW
  # Produces:  app-release.apk   (direct install / sharing)
  #            app-release.aab   (Google Play Store upload)
  #
  # Before first build, add these Environment Variables in Codemagic
  # (App Settings → Environment variables):
  #
  #   CM_KEYSTORE          — Base64 of nksereke-upload-keystore.jks
  #                          Generate with:
  #                            base64 android/app/nksereke-upload-keystore.jks
  #   CM_KEYSTORE_PASSWORD — storePassword   (MKPOIKANA1@dt)
  #   CM_KEY_ALIAS         — keyAlias        (upload)
  #   CM_KEY_PASSWORD      — keyPassword     (MKPOIKANA1@dt)
  #
  # Mark all four as "Secure" in the Codemagic UI so they're never logged.
  # ─────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release (APK + AAB)
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: 3.38.1        # pin to your local Flutter version
      java: 17               # required by build.gradle.kts (VERSION_17)
      vars:
        PACKAGE_NAME: "com.nksereke.user"

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      # 1. Android SDK path (required by Gradle)
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      # 2. Decode keystore & write key.properties from secure env vars.
      #    This overwrites the committed key.properties so passwords are
      #    never stored in source control.
      - name: Set up signing
        script: |
          echo "$CM_KEYSTORE" | base64 --decode \
            > "$CM_BUILD_DIR/android/app/release.keystore"

          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=release.keystore
          EOF

      # 3. Fetch dependencies
      - name: Get Flutter packages
        script: flutter pub get

      # 4. Run tests (remove this block if you have no tests yet)
      - name: Run tests
        script: flutter test
        ignore_failure: true

      # 5. Build Android App Bundle (Play Store)
      - name: Build AAB
        script: |
          flutter build appbundle \
            --release \
            --build-name=1.0.0 \
            --build-number=$(($(git rev-list HEAD --count)))

      # 6. Build APK (direct download / beta testers)
      - name: Build APK
        script: |
          flutter build apk \
            --release \
            --build-name=1.0.0 \
            --build-number=$(($(git rev-list HEAD --count)))

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - howellshenry22@gmail.com
        notify:
          success: true
          failure: true

      # ── Uncomment & configure when ready for Google Play ──────────────────
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS   # JSON key file
      #   track: internal                                     # internal | alpha | beta | production
      #   submit_as_draft: true
      # ──────────────────────────────────────────────────────────────────────


  # ─────────────────────────────────────────────────────────────────────────────
  # ANDROID DEBUG WORKFLOW  (quick PR/branch checks — no signing needed)
  # ─────────────────────────────────────────────────────────────────────────────
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      flutter: 3.38.1
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
        - pattern: main
          include: false   # main always uses the release workflow

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build debug APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - howellshenry22@gmail.com
        notify:
          success: false   # only email on failure for debug builds
          failure: true
