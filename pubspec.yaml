  #         weight: 700
  #       - asset: assets/fonts/Poppins-ExtraBold.ttf
  #         weight: 800  

flutter_launcher_icons:
  image_path: "assets/images/1024.png"
  android:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  linux:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  ios:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
    remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/1024.png"
    background_color: "#ffffff"
