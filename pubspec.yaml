name: ctluser
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons:
  flutter_svg:
  cached_network_image:
  flutter_rating_bar:
  smooth_page_indicator:
  pin_code_fields:
  timelines_plus:
  grouped_list:
  google_fonts: ^6.2.1
  share_plus: ^10.0.2
  flutter_secure_storage: ^9.0.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  image_picker: ^1.0.7
  shimmer: ^3.0.0

  # Payments WebView
  webview_flutter: ^4.7.0


  # State management & navigation
  get:

  # Storage & connectivity
  shared_preferences:
  connectivity_plus:
  dio:


  # Forms & input
  intl_phone_number_input:
  country_pickers:
  dropdown_search:
  sms_autofill:

  # Utilities
  intl:
  overlay_kit:

  # Auth
  google_sign_in: ^7.2.0
  lucide_icons_flutter: ^3.1.10
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

